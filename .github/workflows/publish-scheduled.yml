name: Publish scheduled posts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish due scheduled posts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ATN_BOT_EMAIL: ${{ secrets.ATN_BOT_EMAIL }}
          ATN_BOT_PASSWORD: ${{ secrets.ATN_BOT_PASSWORD }}
          ATN_ORG_ID: ${{ secrets.ATN_ORG_ID }}
          ZAF_CONSULTANCY_FB_PAGE_ID: ${{ secrets.ZAF_CONSULTANCY_FB_PAGE_ID }}
          ZAF_CONSULTANCY_FB_PAGE_TOKEN: ${{ secrets.ZAF_CONSULTANCY_FB_PAGE_TOKEN }}
          ZAF_CONSULTANCY_IG_USER_ID: ${{ secrets.ZAF_CONSULTANCY_IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ATN_TELEGRAM_CHAT_ID: ${{ secrets.ATN_TELEGRAM_CHAT_ID }}
        run: python -m phase3_content.publish_scheduled
