name: Poll Telegram for ATN bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll for updates and process
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAGE_REPO_TOKEN: ${{ secrets.IMAGE_REPO_TOKEN }}
          ZAF_CONSULTANCY_FB_PAGE_ID: ${{ secrets.ZAF_CONSULTANCY_FB_PAGE_ID }}
          ZAF_CONSULTANCY_FB_PAGE_TOKEN: ${{ secrets.ZAF_CONSULTANCY_FB_PAGE_TOKEN }}
          ZAF_CONSULTANCY_IG_USER_ID: ${{ secrets.ZAF_CONSULTANCY_IG_USER_ID }}
        run: python -m bot.main

      - name: Commit updated bot state
        run: |
          git config user.name "atn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/offset.json content/pending_posts.json
          git diff --staged --quiet || git commit -m "Bot state update [skip ci]"
          git push
