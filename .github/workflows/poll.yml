name: Poll Telegram for ATN bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Without this, the default GITHUB_TOKEN is read-only and the "Commit
# updated bot state" step below fails silently on every single run ("403:
# Write access to repository not granted") -- the offset never actually
# saves, so every run re-reads the same old Telegram messages from
# scratch and re-sends replies to all of them. This was live in
# production for hours before being caught (2026-08-18) -- confirmed via
# `gh run list` showing every scheduled run as "failure".
permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll for updates and process
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IMAGE_REPO_TOKEN: ${{ secrets.IMAGE_REPO_TOKEN }}
          ZAF_CONSULTANCY_FB_PAGE_ID: ${{ secrets.ZAF_CONSULTANCY_FB_PAGE_ID }}
          ZAF_CONSULTANCY_FB_PAGE_TOKEN: ${{ secrets.ZAF_CONSULTANCY_FB_PAGE_TOKEN }}
          ZAF_CONSULTANCY_IG_USER_ID: ${{ secrets.ZAF_CONSULTANCY_IG_USER_ID }}
          # Needed by the /monitor button (list_recent_notifications) and
          # the Telegram-side "schedule" command (insert_scheduled_post) --
          # both crashed with KeyError before this was added (confirmed via
          # a real failed run, 2026-08-19).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ATN_BOT_EMAIL: ${{ secrets.ATN_BOT_EMAIL }}
          ATN_BOT_PASSWORD: ${{ secrets.ATN_BOT_PASSWORD }}
          ATN_ORG_ID: ${{ secrets.ATN_ORG_ID }}
        run: python -m bot.main

      - name: Commit updated bot state
        run: |
          git config user.name "atn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/offset.json content/pending_posts.json
          git diff --staged --quiet && exit 0
          git commit -m "Bot state update [skip ci]"
          # See grants-sweep.yml's identical step for why this retries --
          # a concurrent run pushing first must not lose this run's state.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected, rebasing onto origin/main and retrying (attempt $i)..."
            git pull --rebase origin main
          done
          echo "::error::Failed to push bot state after 5 attempts"
          exit 1
