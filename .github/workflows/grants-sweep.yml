name: Phase 1 grant search sweep

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Same fix as poll.yml -- without this, the state-commit step 403s and
# every run would re-notify the same already-seen grants forever.
permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run grant search sweep
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ATN_TELEGRAM_CHAT_ID: ${{ secrets.ATN_TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ATN_BOT_EMAIL: ${{ secrets.ATN_BOT_EMAIL }}
          ATN_BOT_PASSWORD: ${{ secrets.ATN_BOT_PASSWORD }}
          ATN_ORG_ID: ${{ secrets.ATN_ORG_ID }}
        run: python -m phase1_grants.search

      - name: Commit updated seen-grants state
        run: |
          git config user.name "atn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/seen_grants.json
          git diff --staged --quiet || git commit -m "Grants sweep state update [skip ci]"
          git push
