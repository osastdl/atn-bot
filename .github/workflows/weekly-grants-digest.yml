name: Weekly funder list digest

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send weekly digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ATN_TELEGRAM_CHAT_ID: ${{ secrets.ATN_TELEGRAM_CHAT_ID }}
        run: python -m phase1_grants.weekly_digest
