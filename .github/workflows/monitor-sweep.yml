name: Phase 2 monitoring sweep

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

# Same fix as the other sweeps -- without this, the state-commit step
# 403s and every run re-notifies the same already-seen results forever.
permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitoring sweep
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ATN_TELEGRAM_CHAT_ID: ${{ secrets.ATN_TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ATN_BOT_EMAIL: ${{ secrets.ATN_BOT_EMAIL }}
          ATN_BOT_PASSWORD: ${{ secrets.ATN_BOT_PASSWORD }}
          ATN_ORG_ID: ${{ secrets.ATN_ORG_ID }}
        run: python -m phase2_monitor.monitor

      - name: Commit updated seen-monitor state
        run: |
          git config user.name "atn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/seen_monitor.json
          git diff --staged --quiet && exit 0
          git commit -m "Monitor sweep state update [skip ci]"
          # See grants-sweep.yml's identical step for why this retries --
          # a concurrent run pushing first must not lose this run's state.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected, rebasing onto origin/main and retrying (attempt $i)..."
            git pull --rebase origin main
          done
          echo "::error::Failed to push seen-monitor state after 5 attempts"
          exit 1
